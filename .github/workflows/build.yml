name: Build

# CI: build and test on every push to master/develop and on pull requests.
on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP 8.7.x requires JDK 17 to run Gradle (the app still targets JVM 11 bytecode).
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Instrumentation tests need a device, so CI can't run them — but it must at least
      # keep them compiling (they're part of the local acceptance gate in CLAUDE.md).
      - name: Compile instrumentation sources
        run: ./gradlew compileDebugAndroidTestKotlin

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: noimpulse-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
