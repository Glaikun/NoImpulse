name: Code Quality

# Report-only: Android Lint + detekt run on the same triggers as Build, but this workflow is
# intentionally NOT registered as a required status check in branch protection — it surfaces
# findings without blocking merges. (build.yml remains the only required check.)
on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # AGP 8.7.x requires JDK 17 to run Gradle (the app still targets JVM 11 bytecode).
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # continue-on-error so a lint failure doesn't skip detekt (and vice versa) — both tools'
      # reports should surface from the same run.
      - name: Run Android Lint
        id: lint
        continue-on-error: true
        run: ./gradlew lintDebug

      - name: Run detekt
        id: detekt
        continue-on-error: true
        run: ./gradlew detekt

      - name: Upload lint report
        if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore

      - name: Upload detekt report
        if: steps.detekt.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: |
            app/build/reports/detekt/detekt.html
            app/build/reports/detekt/detekt.xml
          if-no-files-found: ignore

      # Report-only: fail the job so red/green is visible at a glance, but this workflow is
      # never added to branch protection, so it can't block a merge.
      - name: Surface findings
        if: steps.lint.outcome == 'failure' || steps.detekt.outcome == 'failure'
        run: |
          echo "Lint or detekt reported issues — see the uploaded report artifacts above."
          exit 1
