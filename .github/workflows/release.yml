name: Release

# Manual release. Releases the version develop currently holds: merges develop into master,
# tags + publishes that version, then bumps develop to the next development version.
# Pick how develop's version should be bumped *after* the release when you run the workflow.
#
# Requires the `RELEASE_SSH_KEY` secret (private half of the "release-bot" deploy key). All
# branch pushes below are authenticated as that deploy key, which is the only actor allowed
# to bypass the master/develop branch rulesets.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: How to bump develop's version AFTER the release
        type: choice
        required: true
        default: minor
        options:
          - major
          - minor
          - patch

permissions:
  contents: write   # create the GitHub Release (branch/tag pushes use the deploy key, not this token)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Check out via the deploy key so every push (master, tag, develop) is authenticated as
      # the deploy key and therefore bypasses the branch rulesets. fetch-depth: 0 gives the full
      # history the fast-forward merge needs.
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_SSH_KEY }}

      - name: Fetch master and develop
        run: git fetch origin master develop

      # AGP 8.7.x requires JDK 17 to run Gradle (the app still targets JVM 11 bytecode).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # The version currently on develop is the one we release. Read it before anything changes.
      # versionName is treated as semver (MAJOR.MINOR.PATCH); a two-part "1.0" reads as 1.0.0.
      - name: Read release version
        id: version
        run: |
          set -euo pipefail
          GRADLE_FILE=app/build.gradle.kts
          name=$(sed -nE 's/.*versionName *= *"([^"]+)".*/\1/p' "$GRADLE_FILE")
          code=$(sed -nE 's/.*versionCode *= *([0-9]+).*/\1/p' "$GRADLE_FILE")
          echo "Releasing $name (code $code)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"

      # master only ever advances through this workflow, so the merge must be a fast-forward of
      # develop. A non-ff failure stops the run loudly rather than rewriting history.
      - name: Merge develop into master
        run: |
          set -euo pipefail
          git config user.name "noimpulse-release-bot"
          git config user.email "noimpulse-release-bot@users.noreply.github.com"
          git checkout master
          git merge --ff-only origin/develop

      - name: Assemble release APK
        run: ./gradlew assembleRelease

      # Sign the APK if signing secrets are configured; otherwise emit the unsigned APK (not
      # installable) so the release still produces an artifact.
      - name: Package APK
        id: apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            out="NoImpulse-${VERSION_NAME}.apk"
            "${build_tools}zipalign" -p -f 4 "$unsigned" aligned.apk
            "${build_tools}apksigner" sign \
              --ks keystore.jks \
              --ks-pass "pass:${KEYSTORE_PASSWORD}" \
              --ks-key-alias "${KEY_ALIAS}" \
              --key-pass "pass:${KEY_PASSWORD}" \
              --out "$out" aligned.apk
            rm -f keystore.jks aligned.apk
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            out="NoImpulse-${VERSION_NAME}-unsigned.apk"
            cp "$unsigned" "$out"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Tag release and push master
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG"
          git push origin master
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
          SIGNED: ${{ steps.apk.outputs.signed }}
        run: |
          set -euo pipefail
          notes="Automated release $TAG."
          if [ "$SIGNED" != "true" ]; then
            notes="${notes}"$'\n\n'"> ⚠️ This APK is **unsigned** and cannot be installed directly. Configure the \`KEYSTORE_BASE64\`, \`KEYSTORE_PASSWORD\`, \`KEY_ALIAS\`, and \`KEY_PASSWORD\` repository secrets to publish a signed APK."
          fi
          gh release create "$TAG" "$APK" --title "$TAG" --notes "$notes"

      # Open the next development version on develop. The deploy key bypasses develop's PR rule.
      - name: Bump develop to next version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          CURRENT_NAME: ${{ steps.version.outputs.name }}
          CURRENT_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          GRADLE_FILE=app/build.gradle.kts

          IFS='.' read -r major minor patch <<< "$CURRENT_NAME" || true
          major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}

          case "$RELEASE_TYPE" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          new_name="$major.$minor.$patch"
          new_code=$((CURRENT_CODE + 1))

          git checkout develop
          sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"$new_name\"/" "$GRADLE_FILE"
          sed -i -E "s/versionCode = [0-9]+/versionCode = $new_code/" "$GRADLE_FILE"
          git add "$GRADLE_FILE"
          git commit -m "Start next development version $new_name"
          git push origin develop
          echo "develop now at $new_name (code $new_code)"
