name: CodeQL

# Security scanning, report-only (see code-quality.yml's comment — same rationale: not a
# required status check, purely additive).
on:
  push:
    branches: [master, develop]
  pull_request:
  schedule:
    - cron: '30 3 * * 1'   # weekly, Monday 03:30 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # AGP 8.7.x requires JDK 17 to run Gradle (the app still targets JVM 11 bytecode).
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin

      # CodeQL's autobuild heuristic doesn't reliably drive Hilt/KSP annotation processing on
      # an AGP project, so build explicitly with the same task build.yml already trusts,
      # instead of relying on autobuild.
      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
